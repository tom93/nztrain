name: Continuous Integration
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-20.04
    services:
      postgres:
        image: postgres:11-alpine
        ports: ["5432:5432"]
        env:
          #POSTGRES_DB: nztraintest # not required because script/install.bash creates the database
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432"

    steps:
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          key: apt-cache
          path: |
            ~/apt-cache

      - name: Import apt package cache
        run: |
          # TODO WIP
          if [ -d ~/apt-cache ]; then
            if [ -d ~/apt-cache/lists ]; then sudo mv ~/apt-cache/lists/* /var/lib/apt/lists/; fi # TODO: handle empty dir (also below)
            if [ -d ~/apt-cache/archives ]; then sudo mv ~/apt-cache/archives/* /var/cache/apt/archives/; fi
            rm -r ~/apt-cache
          fi

      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - run: bash script/install/config.bash --defaults
        env:
          DATABASE_INSTALL: false
          DATABASE_USERNAME: postgres
          DATABASE:
          TEST_DATABASE: nztraintest
          REDIS_INSTALL: false
          REDIS_PASS:
          SCHEDULE_BACKUPS: 0
          ISOLATE_ROOT: /
          ISOLATE_CGROUPS: false
          ISOLATE_BRANCH: v1.10.1

      - name: Back up db/schema.rb # it will be overwritten when install.bash runs migrate.bash; back up the original so we can check if it's up to date
        run: cp db/schema.rb db/schema.rb.git

      - run: AUTOCONFIRM=true script/install.bash
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      #- run: bundle exec rake db:test:load # not required because script/install.bash runs db:migrate
      - run: bundle exec rspec

      - name: Check that db/schema.rb is up to date
        run: |
          diff -u db/schema.rb.git db/schema.rb >&2 ||
            { echo "Error: db/schema.rb is out of date" >&2; exit 1; }

      - uses: coverallsapp/github-action@v2

      - name: Export apt package cache
        run: |
          # TODO WIP (should only export new files)
          mkdir ~/apt-cache ~/apt-cache/lists ~/apt-cache/archives
          ln -t ~/apt-cache/lists /var/lib/apt/lists/*
          ln -t ~/apt-cache/archives /var/cache/apt/archives/*.deb

  lint:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - run: bundle exec standardrb --parallel
